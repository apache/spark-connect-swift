name: Build and test

on:
  workflow_call:

jobs:
  license-check:
    name: "License Check"
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check license header
        uses: apache/skywalking-eyes@a196742f472feaffafea537ce5a2a4c3c53a8de4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .github/.licenserc.yaml

  build-macos:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift build -c release

  build-ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        docker run swift:6.4.1 uname -a
        docker run -v $PWD:/spark -w /spark swift:6.4.1 swift build -c release

  build-ubuntu-arm:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        docker run swift:6.4.1 uname -a
        docker run -v $PWD:/spark -w /spark swift:6.4.1 swift build -c release

  integration-test-ubuntu:
    runs-on: ubuntu-26.04
    env:
      SPARK_REMOTE: "sc://localhost:15003"
    services:
      spark:
        image: apache/spark:4.0.5-java21-scala
        env:
          SPARK_NO_DAEMONIZE: 1
        ports:
          - 15003:15002
        options: --entrypoint /opt/spark/sbin/start-connect-server.sh
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        docker run swift:6.4.1 uname -a
        docker run --add-host=host.docker.internal:host-gateway -v $PWD:/spark -w /spark -e SPARK_REMOTE='sc://host.docker.internal:15003' swift:6.4.1 swift test --no-parallel -c release

  integration-test-ubuntu-spark41:
    runs-on: ubuntu-26.04
    env:
      SPARK_REMOTE: "sc://localhost:15003"
    services:
      spark:
        image: apache/spark:4.1.4-scala
        env:
          SPARK_NO_DAEMONIZE: 1
        ports:
          - 15003:15002
        options: --entrypoint /opt/spark/sbin/start-connect-server.sh
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        docker run swift:6.4.1 uname -a
        docker run --add-host=host.docker.internal:host-gateway -v $PWD:/spark -w /spark -e SPARK_REMOTE='sc://host.docker.internal:15003' swift:6.4.1 swift test --no-parallel -c release

  integration-test-ubuntu-spark42:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Start Spark Connect Server
      run: |
        docker run -d --name spark -p 15003:15002 -e SPARK_NO_DAEMONIZE=1 \
          --entrypoint /opt/spark/sbin/start-connect-server.sh \
          apache/spark:4.2.1-scala-java25 \
          -c spark.sql.geospatial.enabled=true \
          -c spark.sql.timeType.enabled=true
    - name: Test
      run: |
        docker run swift:6.4.1 uname -a
        docker run --add-host=host.docker.internal:host-gateway -v $PWD:/spark -w /spark -e SPARK_REMOTE='sc://host.docker.internal:15003' swift:6.4.1 swift test --no-parallel -c release

  integration-test-ubuntu-spark43:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: Start Spark Connect Server
      run: |
        docker run -d --name spark -p 15003:15002 -e SPARK_NO_DAEMONIZE=1 \
          --entrypoint /opt/spark/sbin/start-connect-server.sh \
          apache/spark:4.3.0-scala-java25 \
          -c spark.sql.geospatial.enabled=true \
          -c spark.sql.timeType.enabled=true
    - name: Test
      run: |
        docker run swift:6.4.1 uname -a
        docker run --add-host=host.docker.internal:host-gateway -v $PWD:/spark -w /spark -e SPARK_REMOTE='sc://host.docker.internal:15003' swift:6.4.1 swift test --no-parallel -c release

  integration-test-mac-spark41:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.1.4
        sha512: 1461b6c425d290913e7be97bfec738abc843c663d177dc57e32b82874d20144ed67dcca692a57efc4e5b40d2f001ee0e9e0d2d7b088ae58f5378ecac92739076
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh
        cd -
        swift test --no-parallel -c release

  integration-test-mac-spark42:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.2.1
        sha512: 2f76b113ebb2f3677766e38b6dc78f27756c5ae5a7c103f1a76dac523dba8e5f82077b7f480360391c0cceee79ad712d7843f23389fbfeb18bc018fb85e27866
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh -c spark.sql.timeType.enabled=true
        cd -
        swift test --no-parallel -c release

  integration-test-mac-spark43:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.3.0
        sha512: 51a2473d09c74b6b755d3c4158275922fe4fed9c3801d9e48ade6083dc03b45693274020fe0fcf2be2a607a6a828f7159f78609ef913049e98c1882d2d0aab5f
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh -c spark.sql.timeType.enabled=true
        cd -
        swift test --no-parallel -c release

  integration-test-mac:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.0.5
        sha512: c36f0e8445513d3d746d20aa051787f417477a2550b002bb4e4c3797e6152a6a04cce7121344cd11511e18642c852ca5893e872564a207ee9d8d3befe6309b20
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh
        cd -
        swift test --no-parallel -c release

  integration-test-token:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
      SPARK_CONNECT_AUTHENTICATE_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.1.4
        sha512: 1461b6c425d290913e7be97bfec738abc843c663d177dc57e32b82874d20144ed67dcca692a57efc4e5b40d2f001ee0e9e0d2d7b088ae58f5378ecac92739076
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh
        cd -
        swift test --no-parallel -c release

  integration-test-mac-spark4-iceberg:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
      SPARK_ICEBERG_TEST_ENABLED: "true"
    steps:
    - uses: actions/checkout@v7
    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 21
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.0.5
        sha512: c36f0e8445513d3d746d20aa051787f417477a2550b002bb4e4c3797e6152a6a04cce7121344cd11511e18642c852ca5893e872564a207ee9d8d3befe6309b20
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh --packages org.apache.spark:spark-connect_2.13:4.0.5,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.12.0 -c spark.sql.catalog.local=org.apache.iceberg.spark.SparkCatalog -c spark.sql.catalog.local.type=hadoop -c spark.sql.catalog.local.warehouse=/tmp/spark/warehouse -c spark.sql.defaultCatalog=local
        # Iceberg jars are resolved at startup, so wait until the server is ready.
        for i in $(seq 1 12); do
          grep -q "Spark Connect server started at" /tmp/spark/logs/*.out 2>/dev/null && break
          sleep 5
        done
        cd -
        swift test --filter DataFrameWriterV2Tests -c release
        swift test --filter IcebergTest -c release

  integration-test-mac-spark41-iceberg:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: localhost
      SPARK_ICEBERG_TEST_ENABLED: "true"
    steps:
    - uses: actions/checkout@v7
    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 21
    - name: Build
      run: swift test --filter NOTHING -c release
    - uses: ./.github/actions/setup-spark
      with:
        version: 4.1.4
        sha512: 1461b6c425d290913e7be97bfec738abc843c663d177dc57e32b82874d20144ed67dcca692a57efc4e5b40d2f001ee0e9e0d2d7b088ae58f5378ecac92739076
    - name: Test
      run: |
        cd /tmp/spark/sbin
        ./start-connect-server.sh --packages org.apache.spark:spark-connect_2.13:4.1.4,org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.12.0 -c spark.sql.catalog.local=org.apache.iceberg.spark.SparkCatalog -c spark.sql.catalog.local.type=hadoop -c spark.sql.catalog.local.warehouse=/tmp/spark/warehouse -c spark.sql.defaultCatalog=local
        # Iceberg jars are resolved at startup, so wait until the server is ready.
        for i in $(seq 1 12); do
          grep -q "Spark Connect server started at" /tmp/spark/logs/*.out 2>/dev/null && break
          sleep 5
        done
        cd -
        swift test --filter DataFrameWriterV2Tests -c release
        swift test --filter IcebergTest -c release
