name: Publish Image

on:
  workflow_dispatch:
    inputs:
      example:
        description: 'list of examples to publish (JSON)'
        required: true
        # keep in sync with default value of strategy matrix 'example'
        default: '["app", "pi", "pyspark-connect", "spark-sql", "stream"]'

jobs:
  publish-image:
    if: ${{ startsWith(github.repository, 'apache/') }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        # keep in sync with default value of workflow_dispatch input 'example'
        example: ${{ fromJSON( inputs.example || '["app", "pi", "pyspark-connect", "spark-sql", "stream"]' ) }}
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: main
    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        # build cache on Github Actions, See: https://docs.docker.com/build/cache/backends/gha/#using-dockerbuild-push-action
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: Examples/${{ matrix.example }}
        file: Examples/${{ matrix.example }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: apache/spark-connect-swift:${{ matrix.example }}
