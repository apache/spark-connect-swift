name: Publish Image

on:
  workflow_dispatch:
    inputs:
      example:
        description: 'list of examples to publish (JSON)'
        required: true
        # keep in sync with default value of strategy matrix 'example'
        default: '["app", "pi", "pyspark-connect", "spark-sql", "stream"]'

jobs:
  publish-image:
    if: ${{ startsWith(github.repository, 'apache/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        # keep in sync with default value of workflow_dispatch input 'example'
        example: ${{ fromJSON( inputs.example || '["app", "pi", "pyspark-connect", "spark-sql", "stream"]' ) }}
    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: main
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with:
        # build cache on Github Actions, See: https://docs.docker.com/build/cache/backends/gha/#using-dockerbuild-push-action
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: Examples/${{ matrix.example }}
        file: Examples/${{ matrix.example }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: apache/spark-connect-swift:${{ matrix.example }}
